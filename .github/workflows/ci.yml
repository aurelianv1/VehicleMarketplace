# Integrare continuă: la fiecare push și pull request, GitHub rulează automat
# testele unitare și build-ul. Un commit care strică ceva apare cu ✗ roșu pe GitHub.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — teste unitare (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      # Cheie doar pentru teste; cea reală stă în .env, care nu ajunge pe GitHub
      SECRET_KEY: cheie-de-test-pentru-ci-de-cel-putin-32-de-caractere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend:
    name: Frontend — lint, teste unitare (Vitest), build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
